name: Bug
description: Algo não está funcionando como deveria
labels: ["tipo:bug"]
body:
  - type: markdown
    attributes:
      value: "Valeu por avisar! O Callstor agradece."
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra o app
        2. Clique em ...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app ou launcher
      placeholder: "ex.: 0.4.0 (canal beta)"
  - type: dropdown
    id: so
    attributes:
      label: Sistema operacional
      options: [Windows 11, Windows 10, macOS, Linux]
  - type: textarea
    id: logs
    attributes:
      label: Logs ou capturas de tela
      render: shell
