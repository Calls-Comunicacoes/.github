name: Ideia ou funcionalidade
description: Sugira algo novo para o Calls
labels: ["tipo:feature"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina que funcione?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
